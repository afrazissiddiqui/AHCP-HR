<div class="page">

  <!-- ACTION BAR — mirrors HR shellbar dropdown navigable sections -->
  <div class="action-bar">
    @for (action of menuActions; track action.value) {
      <button type="button" class="action" (click)="openAction(action)">
        <ui5-icon [attr.name]="action.icon"></ui5-icon>
        <span>{{ action.label }}</span>
      </button>
    }
  </div>

  <!-- WELCOME -->
  <div class="welcome">
    <h2>Good evening</h2>

    <div class="chips">
      <button class="chip">Team Absence Calendar</button>
      <button class="chip">My Team Positions</button>
      <button class="chip">Pending Workflows</button>
    </div>
  </div>

</div>
