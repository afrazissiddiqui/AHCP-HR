<div class="setup-layout">
  <div class="setup-content">
    <div class="setup-body">
      <section class="setup-hero setup-hero--compact">
        <div class="setup-hero__content">
          <span class="hero-badge">Setup Wizard</span>
          <h2>Edit KPI</h2>
          <p>Update the KPI setup entry with department details and measurable rows for the review process.</p>
        </div>
      </section>

      <section class="form-panel">
        <div class="form-panel-head">
          <div>
            <h3 class="form-panel-title">KPI Setup Details</h3>
            <p class="panel-subtitle">Update the header values and KPI definition rows.</p>
          </div>
          <div class="button-group">
            <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
            <button type="button" class="btn-primary" [disabled]="loading()" (click)="saveKpi()">
              {{ loading() ? 'Loading…' : 'Update KPI' }}
            </button>
          </div>
        </div>

        <div *ngIf="loading()" class="panel-message panel-message--loading">Loading KPI details…</div>

        <div *ngIf="!loading()" class="form-content">
          <div class="form-grid">
            <div class="field-group">
              <label>Department</label>
              <select [(ngModel)]="department" [disabled]="departmentLoading()">
                <option value="" disabled>Select department</option>
                <option *ngFor="let option of departmentOptions()" [value]="option">{{ option }}</option>
              </select>
            </div>
            <div class="field-group">
              <label>Employment Nature</label>
              <select [(ngModel)]="employmentNature">
                <option value="" disabled>Select employment nature</option>
                <option *ngFor="let option of employmentNatureOptions" [value]="option">{{ option }}</option>
              </select>
            </div>
            <div class="field-group">
              <label>Work Level</label>
              <select [(ngModel)]="workLevel">
                <option value="" disabled>Select work level</option>
                <option *ngFor="let option of workLevelOptions" [value]="option">{{ option }}</option>
              </select>
            </div>
            <div class="field-group">
              <label>Employment Category</label>
              <select [(ngModel)]="employmentCategory">
                <option value="" disabled>Select employment category</option>
                <option *ngFor="let option of employmentCategoryOptions" [value]="option">{{ option }}</option>
              </select>
            </div>
            <div class="field-group">
              <label>Employment Status</label>
              <select [(ngModel)]="employmentStatus">
                <option value="" disabled>Select employment status</option>
                <option *ngFor="let option of employmentStatusOptions" [value]="option">{{ option }}</option>
              </select>
            </div>
            <div class="field-group">
              <label>Designation</label>
              <input type="text" [(ngModel)]="designation" />
            </div>
          </div>

          <div class="kpi-section">
            <div class="kpi-section-head">
              <h4>KPI Rows</h4>
              <button type="button" class="btn-secondary" (click)="addKpiRow()">Add Row</button>
            </div>

            <div class="kpi-list">
              <div class="kpi-card" *ngFor="let item of kpiRows; let index = index">
                <div class="card-actions">
                  <strong>KPI {{ index + 1 }}</strong>
                  <button type="button" class="btn-link" (click)="removeKpiRow(index)" *ngIf="kpiRows.length > 1">Remove</button>
                </div>
                <div class="form-grid">
                  <div class="field-group full-width">
                    <label>KPI</label>
                    <input type="text" [(ngModel)]="kpiRows[index].kpi" />
                  </div>
                  <div class="field-group">
                    <label>Weight</label>
                    <input type="text" [(ngModel)]="kpiRows[index].weight" />
                  </div>
                  <div class="field-group">
                    <label>Weight Percentage</label>
                    <input type="text" [(ngModel)]="kpiRows[index].weight_percentage" />
                  </div>
                  <div class="field-group full-width">
                    <label>Definition / Measurement</label>
                    <textarea rows="3" [(ngModel)]="kpiRows[index].defination_measurement"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
